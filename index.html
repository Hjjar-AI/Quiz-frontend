<!-- frontend/index.html -->
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9edf1" />

    <title>Mukhtabir</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- ============================================================
       Locale bootstrap.
       Reads the persisted language from localStorage and applies
       it to <html lang dir data-locale> BEFORE any CSS paints.
       Must run above the font stylesheet links and the
       __cdnFallback utility so the initial render is already in
       the correct direction (no LTR→RTL flash).
       Mirrors the theme bootstrap below.
       ============================================================ -->
    <script>
      ;(function () {
        try {
          var supported = { ar: 'rtl', en: 'ltr' }
          var saved = localStorage.getItem('locale')
          var locale = saved && supported[saved] ? saved : 'ar'
          document.documentElement.setAttribute('lang', locale)
          document.documentElement.setAttribute('dir', supported[locale])
          document.documentElement.setAttribute('data-locale', locale)
        } catch (e) {
          /* storage disabled / private mode — keep defaults */
        }
      })()
    </script>

    <script>
      ;(function () {
        try {
          var savedDensity = localStorage.getItem('pref_density')
          var density = savedDensity === 'compact' ? 'compact' : 'comfortable'
          document.documentElement.setAttribute('data-density', density)
        } catch (e) {
          /* storage disabled / private mode — keep CSS defaults */
        }
      })()
    </script>

    <!-- Apply only the font choice before paint; font styles load on demand in main.js. -->
    <script>
      ;(function () {
        var font = 'default'
        try {
          var supportedFonts = ['default', 'system', 'noto-arabic', 'inter', 'outfit']
          var savedFont = localStorage.getItem('pref_font')
          if (supportedFonts.indexOf(savedFont) !== -1) font = savedFont
        } catch (e) {
          /* storage unavailable: keep the project default */
        }
        document.documentElement.setAttribute('data-font', font)
      })()
    </script>

    <!-- ============================================================
       Theme bootstrap.
       Reads the persisted theme from localStorage and applies it
       to <html data-theme> BEFORE any CSS paints.

       WHY THIS EXISTS
       ---------------
       Without this, a user whose preference differs from Stone
       would see a default-theme flash on every reload: the CSS was
       parsed and the first paint happened before main.js called
       useTheme().loadSavedTheme(), which is what used to be the
       only writer of `data-theme`. The default in the CSS is
       Stone, so the flash would be "Stone → chosen theme".

       The supported list here must stay in sync with
       `THEMES` in frontend/src/utils/constants.js and with the
       set of `[data-theme="…"]` blocks in the CSS. The old `light`
       value is normalized to `stone`; former `sepia` and `fresh`
       values migrate to `amber` and `lagoon` for existing installations.
       ============================================================ -->
    <script>
      ;(function () {
        try {
          var supported = [
            'stone',
            'iris',
            'blossom',
            'lagoon',
            'slate',
            'ink',
            'amber',
            'dark',
            'midnight',
            'onyx',
            'contrast',
          ]
          var themeColors = {
            stone: '#e9edf1',
            iris: '#ecebf4',
            blossom: '#efedf0',
            lagoon: '#e6eff0',
            slate: '#e7edf2',
            ink: '#e6e6e3',
            amber: '#efebe4',
            dark: '#0d1218',
            midnight: '#0a0f1e',
            onyx: '#000000',
            contrast: '#eef0f2',
          }
          var saved = localStorage.getItem('theme')
          if (saved === 'light') saved = 'stone'
          if (saved === 'sepia') saved = 'amber'
          if (saved === 'fresh') saved = 'lagoon'
          var theme =
            saved === 'auto'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'midnight'
                : 'stone'
              : saved && supported.indexOf(saved) !== -1
                ? saved
                : 'stone'
          document.documentElement.setAttribute('data-theme', theme)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', themeColors[theme])
        } catch (e) {
          /* storage disabled / private mode — keep defaults */
        }
      })()
    </script>

    <!-- ============================================================
       CDN-first asset loader utility
       Tries CDN first. If the CDN is blocked, returns an error,
       or takes longer than the timeout (default 5 s), the local
       copy is injected automatically.
       ============================================================ -->
    <script>
      window.__cdnFallback = (function () {
        var DEFAULT_TIMEOUT = 5000
        function loadCSS(id, cdnUrl, localUrl, timeout) {
          timeout = timeout || DEFAULT_TIMEOUT
          var link = document.createElement('link')
          link.rel = 'stylesheet'
          link.id = id
          link.href = cdnUrl
          var settled = false
          function useLocal() {
            if (settled) return
            settled = true
            link.href = localUrl
          }
          link.onload = function () {
            settled = true
          }
          link.onerror = function () {
            useLocal()
          }
          document.head.appendChild(link)
          setTimeout(function () {
            if (!settled) useLocal()
          }, timeout)
        }
        function loadJS(id, cdnUrl, localUrl, timeout) {
          timeout = timeout || DEFAULT_TIMEOUT
          var script = document.createElement('script')
          script.id = id
          script.src = cdnUrl
          var settled = false
          function useLocal() {
            if (settled) return
            settled = true
            var localScript = document.createElement('script')
            localScript.src = localUrl
            localScript.id = id + '-local'
            document.body.appendChild(localScript)
          }
          script.onload = function () {
            settled = true
          }
          script.onerror = function () {
            useLocal()
          }
          document.body.appendChild(script)
          setTimeout(function () {
            if (!settled) useLocal()
          }, timeout)
        }
        return { loadCSS: loadCSS, loadJS: loadJS }
      })()
    </script>

    <!-- Bootstrap Icons CSS: CDN first → local fallback -->
    <script>
      window.__cdnFallback.loadCSS(
        'bootstrapIconsCss',
        'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css',
        '/bootstrapIcons.css',
        5000,
      )
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
